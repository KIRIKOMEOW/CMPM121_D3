<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Last Mile · Air courier waybill</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/game/style.css" />
  </head>
  <body>
    <main id="app">
      <header class="waybill-header">
        <div>
          <p class="label">Air courier waybill</p>
          <h1>Last Mile</h1>
        </div>
        <button id="preview-delivery" type="button"
          hidden>Preview delivery</button>
        <p id="delivery-stamp" hidden>DELIVERED</p>
        <p id="objective"
          class="objective">Repair the seaplane and deliver the last parcel.</p>
      </header>
      <div class="waybill-body">
        <section class="map" aria-labelledby="map-title">
          <header class="section-heading">
            <h2 id="map-title">Atoll map</h2>
            <button id="mute" type="button" aria-pressed="false">
              Sound: on
            </button>
          </header>
          <div id="grid"></div>
          <div class="controls" aria-label="Keyboard controls">
            <span><kbd>Arrows</kbd> Move</span>
            <span><kbd>Shift</kbd> + <kbd>Arrows</kbd> Gather adjacent cell</span>
          </div>
        </section>
        <aside id="hud" aria-label="Courier records">
          <section aria-labelledby="position-title">
            <h2 id="position-title">Field position</h2>
            <dl class="field-position">
              <dt>Coordinates</dt>
              <dd id="position"></dd>
              <dt>Terrain</dt>
              <dd id="terrain"></dd>
            </dl>
          </section>
          <section class="manifest" aria-labelledby="manifest-title">
            <h2 id="manifest-title">Manifest</h2>
            <div class="manifest-columns label" aria-hidden="true">
              <span>Item</span><span>Qty</span>
            </div>
            <ul id="inventory" aria-labelledby="manifest-title"></ul>
          </section>
          <details class="repair-manual" open>
            <summary id="manual-title">Repair manual</summary>
            <ul id="recipes" aria-labelledby="manual-title"></ul>
          </details>
          <section class="scan" aria-labelledby="scan-title">
            <h2 id="scan-title">Latest scan</h2>
            <p id="live" aria-live="polite">Awaiting first scan.</p>
          </section>
        </aside>
      </div>
    </main>
    <script type="module" src="/game/main.ts"></script>
  </body>
</html>
